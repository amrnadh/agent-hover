name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit · ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run pack:check

  smoke:
    name: Fresh project · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/smoke-fresh.mjs

  e2e:
    name: E2E · Chromium
    runs-on: ubuntu-latest
    env:
      AGENT_HOVER_NO_UPDATE_CHECK: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:isolated
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  e2e-windows:
    name: E2E · Chromium · Windows
    runs-on: windows-latest
    env:
      AGENT_HOVER_NO_UPDATE_CHECK: '1'
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install chromium
      - run: npm run test:e2e:isolated
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-windows
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  e2e-browsers:
    name: E2E · Firefox, WebKit
    runs-on: ubuntu-latest
    env:
      AGENT_HOVER_NO_UPDATE_CHECK: '1'
      AH_BROWSERS: all
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps firefox webkit
      - run: npm run test:e2e:isolated -- --project=firefox --project=webkit
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-browsers
          path: |
            playwright-report/
            test-results/
          retention-days: 7
